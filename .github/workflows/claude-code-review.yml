name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correctness-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Correctness Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          show_full_output: true
          prompt: |
            Review this PR for CORRECTNESS. Focus on:
            - Bugs, logic errors, and broken assumptions
            - Off-by-one errors, null/undefined access, unhandled exceptions
            - Incorrect error path handling
            - Whether tests cover the new behavior and are meaningful
            - Race conditions or concurrency issues (if applicable)
            - Whether the code actually does what it claims

            Before reviewing, read all existing comments and reviews on this PR.
            Only raise issues that have NOT already been mentioned in previous comments.
            If all your findings are already covered by existing comments, output only:
            "## Correctness Review\n\nNo new issues found beyond what has already been flagged."

            Output your review as text, starting with "## Correctness Review".
            Reference specific files and line numbers. If no issues found, say so briefly.

  simplicity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Simplicity Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            Review this PR for OVER-ENGINEERING and unnecessary complexity. Focus on:
            - Is there a shorter/simpler way to achieve the same outcome?
            - Are abstractions justified or premature?
            - Dead code, unused variables, or redundant logic
            - Does the change add complexity without proportional value?
            - Could a standard library function or built-in replace custom code?
            - Is the diff larger than it needs to be for the stated goal?

            Before reviewing, read all existing comments and reviews on this PR.
            Only raise issues that have NOT already been mentioned in previous comments.
            If all your findings are already covered by existing comments, output only:
            "## Simplicity Review\n\nNo new issues found beyond what has already been flagged."

            Output your review as text, starting with "## Simplicity Review".
            Reference specific files and line numbers. If no issues found, say so briefly.

  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Security Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            Review this PR for SECURITY vulnerabilities. Focus on:
            - OWASP Top 10: injection, XSS, broken auth, insecure direct object references, etc.
            - Secrets or credentials accidentally included in the diff
            - Unsafe deserialization or parsing of user input
            - Missing authorization/authentication checks
            - Sensitive data exposed in logs or responses
            - Newly added dependencies with known vulnerabilities

            Before reviewing, read all existing comments and reviews on this PR.
            Only raise issues that have NOT already been mentioned in previous comments.
            If all your findings are already covered by existing comments, output only:
            "## Security Review\n\nNo new issues found beyond what has already been flagged."

            Output your review as text, starting with "## Security Review".
            Reference specific files and line numbers. If no issues found, say so briefly.
