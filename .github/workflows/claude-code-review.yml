name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            ## Step 1: Gather context

            Run these commands:
            ```
            gh pr diff ${{ github.event.pull_request.number }}
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
            ```

            From the comments, build a ledger of every issue previously raised under
            "## Correctness", "## Security", or "## Simplicity" headings.
            For each, note whether a later comment says it was resolved.

            ## Step 2: Verify prior issues against current code

            For each previously raised issue:
            1. Read the CURRENT file at the referenced location.
            2. Mark it as **still present** or **already fixed**.
            3. Do NOT re-report fixed issues.

            ## Step 3: Review for new issues

            For every changed file in the diff, read the FULL current file — not just the diff hunks.
            Trace how changed functions are called by other code. Bugs often hide at boundaries
            between changed and unchanged code.

            ### Correctness — look for:
            - Bugs, logic errors, broken assumptions, off-by-one errors
            - Null/undefined access, unhandled exceptions, incorrect error paths
            - Missing `await`, unhandled promise rejections, sync throws inside async handlers
            - Race conditions — especially around WebSocket message ordering and connection lifecycle
            - Database consistency: multiple writes that should be in a transaction
            - Whether tests exist for new/changed behavior and actually assert the right thing
            - Whether the code does what the PR description claims

            ### Security — look for:
            - **SQL injection**: verify ALL queries use parameterized placeholders (`?`), not string
              concatenation or template literals to build SQL. Check dynamic table/column names are
              validated against an allowlist.
            - **Command injection**: any user-controlled input reaching `node-pty` spawn, shell exec,
              or written to a terminal session is critical severity. Trace the data flow from
              request → handler → pty.
            - **WebSocket auth**: verify upgrade requests are authenticated and per-message
              authorization is enforced. Check that messages aren't processed after connection close.
            - **Path traversal**: if file paths or repo paths are derived from user input, verify
              they're sanitized (no `../` escapes, validated against expected base directories).
            - **Secrets in code**: hardcoded tokens, API keys, credentials, or `.env` values in the diff.
            - **Missing input validation**: user input that reaches the database or shell without
              Zod validation or equivalent.
            - **Sensitive data in logs/responses**: passwords, tokens, or PII logged or returned to clients.

            ### Simplicity — look for:
            - Premature abstractions — helpers or wrappers used only once
            - Dead code, unused variables, redundant logic
            - Could a standard library function replace custom code?
            - Is the diff larger than necessary for the stated goal?

            For every potential issue, read the current file to confirm it still exists before reporting.

            ## Step 4: Classify severity

            Each finding must be tagged:
            - `critical` — security vulnerability, data loss, command/SQL injection
            - `bug` — incorrect behavior that will manifest at runtime
            - `warning` — code smell, missing edge case, or simplicity issue

            ## Step 5: Post your review

            Post a SINGLE PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.

            Use this exact format — no preamble, no methodology explanation, no extras:

            ```
            ## Code Review

            ### Critical
            - **{title}** in `{file}:{line}` — {what's wrong and why it matters}

            ### Bugs
            - **{title}** in `{file}:{line}` — {what's wrong and why it matters}

            ### Warnings
            - **{title}** in `{file}:{line}` — {what's wrong and why it matters}
            ```

            Omit any section that has no findings. If nothing found in any category:
            ```
            ## Code Review

            No issues found.
            ```
