name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correctness-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Correctness Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            First, read all existing comments and reviews on this PR using `gh pr view` and `gh api`.
            Skip any issues already raised by other reviewers.

            Then review the PR diff for CORRECTNESS:
            - Bugs, logic errors, broken assumptions
            - Off-by-one errors, null/undefined access, unhandled exceptions
            - Incorrect error path handling
            - Whether tests cover new behavior and are meaningful
            - Race conditions or concurrency issues
            - Whether the code actually does what it claims

            Post your review as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.
            Start with "## Correctness Review". Reference specific files and line numbers.
            If no new issues found, say so briefly.

  simplicity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Simplicity Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            First, read all existing comments and reviews on this PR using `gh pr view` and `gh api`.
            Skip any issues already raised by other reviewers.

            Then review the PR diff for OVER-ENGINEERING and unnecessary complexity:
            - Is there a shorter/simpler way to achieve the same outcome?
            - Are abstractions justified or premature?
            - Dead code, unused variables, or redundant logic
            - Does the change add complexity without proportional value?
            - Could a standard library function or built-in replace custom code?
            - Is the diff larger than it needs to be for the stated goal?

            Post your review as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.
            Start with "## Simplicity Review". Reference specific files and line numbers.
            If no new issues found, say so briefly.

  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Security Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            First, read all existing comments and reviews on this PR using `gh pr view` and `gh api`.
            Skip any issues already raised by other reviewers.

            Then review the PR diff for SECURITY vulnerabilities:
            - OWASP Top 10: injection, XSS, broken auth, insecure direct object references
            - Secrets or credentials accidentally included in the diff
            - Unsafe deserialization or parsing of user input
            - Missing authorization/authentication checks
            - Sensitive data exposed in logs or responses
            - Newly added dependencies with known vulnerabilities

            Post your review as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.
            Start with "## Security Review". Reference specific files and line numbers.
            If no new issues found, say so briefly.
