name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correctness-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correctness Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            ## Step 1: Gather context

            Read ALL existing comments on this PR:
            ```
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
            ```

            Build a ledger of every issue previously raised in "## Correctness Review" comments.
            For each prior issue, note whether a later comment (e.g. a fix confirmation from @claude)
            says it was resolved.

            ## Step 2: Verify prior issues against current code

            For each previously raised issue:
            1. Read the CURRENT file contents at the referenced location using `cat` or the Read tool.
            2. Determine if the issue is **still present** or **already fixed**.
            3. Do NOT re-report issues that are fixed in the current code, even if they appear in the PR diff.

            ## Step 3: Review for new issues

            Review the PR diff for CORRECTNESS issues not already covered by prior reviews:
            - Bugs, logic errors, broken assumptions
            - Off-by-one errors, null/undefined access, unhandled exceptions
            - Incorrect error path handling
            - Whether tests cover new behavior and are meaningful
            - Race conditions or concurrency issues
            - Whether the code actually does what it claims

            For every potential issue, read the current file to confirm it exists before reporting.

            ## Step 4: Post your review

            Post as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.

            Start with "## Correctness Review" followed by a note about prior reviews:
            - "No existing reviews to build on." OR
            - "Previous review raised N issues; M fixed, K still outstanding."

            Then list only:
            - Outstanding issues from prior reviews (still present in current code)
            - New issues found in this review

            If everything from prior reviews is fixed and no new issues found, post:
            "## Correctness Review\n\nAll previously raised issues have been fixed. No new issues found."

  simplicity-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplicity Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            ## Step 1: Gather context

            Read ALL existing comments on this PR:
            ```
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
            ```

            Build a ledger of every issue previously raised in "## Simplicity Review" comments.
            For each prior issue, note whether a later comment (e.g. a fix confirmation from @claude)
            says it was resolved.

            ## Step 2: Verify prior issues against current code

            For each previously raised issue:
            1. Read the CURRENT file contents at the referenced location using `cat` or the Read tool.
            2. Determine if the issue is **still present** or **already fixed**.
            3. Do NOT re-report issues that are fixed in the current code, even if they appear in the PR diff.

            ## Step 3: Review for new issues

            Review the PR diff for OVER-ENGINEERING and unnecessary complexity not already covered:
            - Is there a shorter/simpler way to achieve the same outcome?
            - Are abstractions justified or premature?
            - Dead code, unused variables, or redundant logic
            - Does the change add complexity without proportional value?
            - Could a standard library function or built-in replace custom code?
            - Is the diff larger than it needs to be for the stated goal?

            For every potential issue, read the current file to confirm it exists before reporting.

            ## Step 4: Post your review

            Post as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.

            Start with "## Simplicity Review" followed by a note about prior reviews:
            - "No existing reviews to build on." OR
            - "Previous review raised N issues; M fixed, K still outstanding."

            Then list only:
            - Outstanding issues from prior reviews (still present in current code)
            - New issues found in this review

            If everything from prior reviews is fixed and no new issues found, post:
            "## Simplicity Review\n\nAll previously raised issues have been fixed. No new issues found."

  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions"
          allowed_bots: "claude[bot]"
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}.

            ## Step 1: Gather context

            Read ALL existing comments on this PR:
            ```
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
            ```

            Build a ledger of every issue previously raised in "## Security Review" comments.
            For each prior issue, note whether a later comment (e.g. a fix confirmation from @claude)
            says it was resolved.

            ## Step 2: Verify prior issues against current code

            For each previously raised issue:
            1. Read the CURRENT file contents at the referenced location using `cat` or the Read tool.
            2. Determine if the issue is **still present** or **already fixed**.
            3. Do NOT re-report issues that are fixed in the current code, even if they appear in the PR diff.

            ## Step 3: Review for new issues

            Review the PR diff for SECURITY vulnerabilities not already covered:
            - OWASP Top 10: injection, XSS, broken auth, insecure direct object references
            - Secrets or credentials accidentally included in the diff
            - Unsafe deserialization or parsing of user input
            - Missing authorization/authentication checks
            - Sensitive data exposed in logs or responses
            - Newly added dependencies with known vulnerabilities

            For every potential issue, read the current file to confirm it exists before reporting.

            ## Step 4: Post your review

            Post as a PR comment using `gh pr comment ${{ github.event.pull_request.number }}`.

            Start with "## Security Review" followed by a note about prior reviews:
            - "No existing reviews to build on." OR
            - "Previous review raised N issues; M fixed, K still outstanding."

            Then list only:
            - Outstanding issues from prior reviews (still present in current code)
            - New issues found in this review

            If everything from prior reviews is fixed and no new issues found, post:
            "## Security Review\n\nAll previously raised issues have been fixed. No new issues found."
