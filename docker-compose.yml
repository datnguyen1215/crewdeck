services:
  frontend:
    build: ./frontend
    ports:
      - "9380:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9381:3000"
    volumes:
      - ./data:/app/data
      - ~/.claude:/home/app/.claude:ro
      - ~/.config/gh:/home/app/.config/gh:ro
      - ~/projects:/repos
    environment:
      - CORS_ORIGIN=http://localhost:9380
      - DB_PATH=/app/data/crewdeck.db
      - CREWDECK_REPOS_DIR=/app/data/repos
      - CREWDECK_REPOS_HOST_PATH=${HOME}/projects
      - CREWDECK_REPOS_CONTAINER_PATH=/repos
