services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "9380:9380"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - VITE_BACKEND_URL=http://backend:9381
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      additional_contexts:
        claude-config: ~/.claude
    volumes:
      - crewdeck-data:/app/data
    environment:
      - PORT=9381
      - HOST=0.0.0.0
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:9380}
      - DB_PATH=/app/data/crewdeck.db
      - CREWDECK_REPOS_DIR=/app/data/repos

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  crewdeck-data:
