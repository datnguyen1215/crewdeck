services:
  frontend:
    build: ./frontend
    network_mode: host
    environment:
      - VITE_BACKEND_URL=http://localhost:9381
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    volumes:
      - crewdeck-data:/app/data
      - ~/.claude:/home/app/.claude:ro
    environment:
      - PORT=9381
      - HOST=127.0.0.1
      - CORS_ORIGIN=http://localhost:9380
      - DB_PATH=/app/data/crewdeck.db
      - CREWDECK_REPOS_DIR=/app/data/repos

volumes:
  crewdeck-data:
