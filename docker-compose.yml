services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "9380:9380"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - VITE_BACKEND_URL=http://backend:9381
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=crewdeck
      - POSTGRES_PASSWORD=crewdeck
    volumes:
      - crewdeck-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - crewdeck-data:/app/data
      - ~/.claude/.credentials.json:/home/node/.claude/.credentials.json
      - ~/.claude.json:/home/node/.claude.json
    environment:
      - PORT=9381
      - HOST=0.0.0.0
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:9380}
      - DB_PATH=/app/data/crewdeck.db
      - CREWDECK_REPOS_DIR=/app/data/repos
      - CREWDECK_WORKTREES_DIR=/app/data/worktrees
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=crewdeck
      - POSTGRES_PASSWORD=crewdeck
    depends_on:
      - postgres

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  crewdeck-data:
  crewdeck-pgdata:
